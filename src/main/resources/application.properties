spring.application.name=billport
server.port=${PORT:3000}

# Hostnames that serve the dashboard (comma-separated, no port).
app.hosts=${APP_HOSTS:localhost}
# Customers can't claim this domain or its subdomains.
app.domain=${APP_DOMAIN:billport.example}
# The upstream's auth token, sent in X-SaaS-Domains-Auth-Token.
app.proxy-auth-token=${PROXY_AUTH_TOKEN:}
# The token on your webhook in the dashboard.
app.webhook-token=${SCD_WEBHOOK_TOKEN:}

# SaaS Custom Domains API. Leave SCD_API_URL unset for the real API.
scd.api-url=${SCD_API_URL:https://app.saascustomdomains.com}
scd.api-token=${SCD_API_TOKEN:}
scd.account-uuid=${SCD_ACCOUNT_UUID:}
scd.upstream-uuid=${SCD_UPSTREAM_UUID:}
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s

# Spring Boot makes Tomcat turn every redirect into an absolute URL built
# from Tomcat's own view of the request: your upstream host, not the
# customer's domain. Relative redirects keep the browser where it is.
server.tomcat.use-relative-redirects=true

# H2 in a file keeps the example small. The schema is plain SQL.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/billport
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Only the health check, at /actuator/health.
management.endpoints.web.exposure.include=health
